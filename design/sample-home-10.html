<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample — home band 10, AD Ilinden Struga</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-surface); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-body); line-height: var(--leading-body); }
    .note { max-width: var(--content-max); margin: 0 auto; padding: var(--space-24) var(--gutter) 0; font-size: var(--text-sm); color: var(--color-muted); }
    [data-band="10"] { background: var(--color-surface); color: var(--color-ink); padding: var(--section-space) 0; }
    .frame { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--gutter); display: grid; gap: var(--space-40); }
    .slot { min-height: 28rem; border-radius: var(--radius-photo); background: var(--color-surface-raised); box-shadow: inset 0 0 0 1px var(--color-line); }
    .stack { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-24); max-width: var(--measure); }
    .mark { margin: 0; font-size: var(--text-xs); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .rule { width: var(--space-48); height: 2px; background: var(--color-field); border: 0; }
    h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--text-display); line-height: var(--leading-display); letter-spacing: var(--tracking-display); text-transform: uppercase; color: var(--color-ink); }
    .pending { margin: 0; }
    p.pending { font-size: var(--text-lead); line-height: var(--leading-body); color: var(--color-muted); min-height: calc(2 * 1lh); }
    h2.pending { min-height: calc(2 * 1lh); }
    a { display: inline-flex; align-items: center; min-height: var(--space-48); padding: var(--space-12) var(--space-24); border-radius: var(--radius-pill); background: var(--color-field); color: var(--color-on-field); font-weight: 600; text-decoration: none; box-shadow: var(--shadow-card); }
    a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: var(--space-4); }
    @media (max-width: 767px) {
      .frame { padding: 0 var(--gutter-narrow); gap: var(--space-32); }
      .slot { min-height: 16rem; }
      h2 { font-size: var(--text-display-sm); }
      h2.pending { min-height: calc(5 * 1lh); }
      p.pending { min-height: calc(3 * 1lh); }
    }
  </style>
</head>
<body>
  <p class="note">Sample only. Home band 10. The ground is limestone. The large plate is the empty photograph. Dark brown is the type, the short rule, and the button.</p>
  <section data-band="10" aria-label="Contact close">
    <div class="frame">
      <div class="slot" aria-hidden="true"></div>
      <div class="stack">
        <p class="mark">AD Ilinden Struga</p>
        <hr class="rule">
        <h2 class="pending">[[PENDING: close headline]]</h2>
        <p class="pending">[[PENDING: close subline]]</p>
        <a href="#contact">Contact us</a>
      </div>
    </div>
  </section>
</body>
</html>
